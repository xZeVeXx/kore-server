# Ausschnitt aus dem Hermes-Profil deines Trainings-Bots
# (~/.hermes/profiles/<profil>/config.yaml). Getestet mit Hermes Agent v0.21.4.
#
# Trage die Bloecke in genau das Profil ein, das die Bridge ueber
# KORE_HERMES_PROFILE aufruft (Vorschlag: kore-coach).
#
# Das Token steht NICHT hier, sondern in der .env desselben Profils
# (~/.hermes/profiles/<profil>/.env, chmod 600):
#
#   MCP_KORE_API_KEY=<KORE_MCP_TOKEN aus der .env des Servers>
#
# Nicht als systemd `Environment=`: Die Bridge startet Hermes mit einer
# minimalen Umgebung und reicht keine Dienst-Variablen weiter.
#
# Pruefen: hermes -p <profil> mcp test kore   ("Connected", "Tools discovered: 8")

mcp_servers:
  kore:
    # Der MCP-Server lauscht nur auf 127.0.0.1 (Hermes laeuft auf demselben Host).
    # Der abschliessende Schraegstrich hinter /mcp gehoert dazu.
    url: http://127.0.0.1:8000/mcp/
    headers:
      Authorization: Bearer ${MCP_KORE_API_KEY}
    enabled: true
    # Nur Werkzeuge: keine MCP-Ressourcen/-Prompts; der Server darf das Modell des Profils nicht per Sampling aufrufen.
    tools:
      resources: false
      prompts: false
    sampling:
      enabled: false

auxiliary:
  # Hermes wuerde sonst jeder Kore-Sitzung per zusaetzlichem Modellaufruf einen
  # Titel geben; der App-Chat braucht keinen.
  title_generation:
    enabled: false

skills:
  # Muss aus bleiben (Hermes-Standard). Mit true fuehrt Hermes `!`cmd``-Zeilen aus
  # SKILL.md per bash aus, sobald ein Skill angezeigt wird — auch im App-Chat, der
  # das skills-Toolset hat. Die Bridge startet dann nicht; kore-doctor meldet es.
  # Nur genau `false` (oder den Schluessel weglassen), kein "false" in Anfuehrungszeichen.
  inline_shell: false
