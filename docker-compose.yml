# Two processes, one SQLite database, one person. No multi-tenancy.
#
# The MCP port (8000) is published on 127.0.0.1 only: the Hermes agent runs on
# the same host and reaches it at http://127.0.0.1:8000/mcp/. KORE_MCP_PORT in .env moves
# the host port (second stack, port taken); inside the container the MCP stays on 8000.
#
# The ingest port (8081) binds to 127.0.0.1 by default; KORE_INGEST_PORT in .env moves the
# host port the same way (the container still listens on 8081). To reach it from your
# iPhone, set KORE_BIND_ADDRESS in .env to the LAN or VPN address of this
# machine (e.g. 10.0.0.10 or 100.64.0.10) — never to 0.0.0.0, and never
# forward these ports in your router. The container checks that address when it
# starts (KORE_PUBLISHED_BIND below) and refuses 0.0.0.0, :: and public addresses.
#
# One .env for you, but each container gets only the keys it needs: ingest does not hold
# the MCP token or the plan-origin secret, MCP does not hold the ingest token. Plan tickets
# are verified in the MCP server only; ingest reads just the principal.
#
# KORE_STATE_DIR is a host directory with the device-pairing state; the ingest
# container reads it read-only at /state. The directory belongs to the user of the
# coach bridge (mode 0750, devices.json 0640); the ingest process (uid 10001) reads it
# through that user's group, KORE_STATE_GID. Create the directory first:
# `scripts/kore-doctor init-state` prints the gid for .env.
#
# Both containers run with a read-only root file system. They write only the SQLite
# database (volume /data) and short-lived temp files (tmpfs /tmp).

services:
  ingest:
    build: .
    image: kore-server:local
    command: ["python", "ingest_api.py"]
    environment:
      KORE_INGEST_TOKEN: "${KORE_INGEST_TOKEN:?set KORE_INGEST_TOKEN in .env}"
      KORE_INSTANCE_ID: "${KORE_INSTANCE_ID:?set KORE_INSTANCE_ID in .env}"
      KORE_PLAN_ORIGIN_PRINCIPAL: "${KORE_PLAN_ORIGIN_PRINCIPAL:?set KORE_PLAN_ORIGIN_PRINCIPAL in .env}"
      KORE_PLAN_ORIGIN_MAX_TTL_SECONDS: "${KORE_PLAN_ORIGIN_MAX_TTL_SECONDS:-300}"
      KORE_PLAN_ORIGIN_CLOCK_SKEW_SECONDS: "${KORE_PLAN_ORIGIN_CLOCK_SKEW_SECONDS:-5}"
      KORE_MCP_ALLOWED_ORIGINS: "${KORE_MCP_ALLOWED_ORIGINS:-}"
      KORE_LEGACY_DB_OWNER_CONFIRMATION: "${KORE_LEGACY_DB_OWNER_CONFIRMATION:-}"
      KORE_DB_PATH: /data/kore.db
      KORE_STATE_DIR: /state
      # The container listens on every interface (Docker's port mapping needs that); the
      # exposure is the host address below. The process refuses to start if it is not
      # loopback, RFC 1918 or 100.64.0.0/10.
      KORE_INGEST_HOST: 0.0.0.0
      KORE_PUBLISHED_BIND: "${KORE_BIND_ADDRESS:-127.0.0.1}"
    ports:
      - "${KORE_BIND_ADDRESS:-127.0.0.1}:${KORE_INGEST_PORT:-8081}:8081"
    volumes:
      - kore-db:/data
      - ${KORE_STATE_DIR:-./state}:/state:ro
    # Supplementary group only: the process stays uid 10001 and gains no capability.
    group_add: ["${KORE_STATE_GID:?set KORE_STATE_GID to the gid of the bridge user (scripts/kore-doctor init-state)}"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # No process in the container needs root or capabilities (port > 1024, user kore).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    # A 16 MiB snapshot body parses to roughly 400-500 MiB; more than that is a runaway.
    mem_limit: 768m
    pids_limit: 128

  mcp:
    build: .
    image: kore-server:local
    command: ["python", "mcp_server.py"]
    environment:
      KORE_MCP_TOKEN: "${KORE_MCP_TOKEN:?set KORE_MCP_TOKEN in .env}"
      KORE_MCP_CLIENT_ID: "${KORE_MCP_CLIENT_ID:?set KORE_MCP_CLIENT_ID in .env}"
      KORE_PLAN_ORIGIN_SECRET: "${KORE_PLAN_ORIGIN_SECRET:?set KORE_PLAN_ORIGIN_SECRET in .env}"
      KORE_INSTANCE_ID: "${KORE_INSTANCE_ID:?set KORE_INSTANCE_ID in .env}"
      KORE_PLAN_ORIGIN_PRINCIPAL: "${KORE_PLAN_ORIGIN_PRINCIPAL:?set KORE_PLAN_ORIGIN_PRINCIPAL in .env}"
      KORE_PLAN_ORIGIN_MAX_TTL_SECONDS: "${KORE_PLAN_ORIGIN_MAX_TTL_SECONDS:-300}"
      KORE_PLAN_ORIGIN_CLOCK_SKEW_SECONDS: "${KORE_PLAN_ORIGIN_CLOCK_SKEW_SECONDS:-5}"
      KORE_MCP_ALLOWED_ORIGINS: "${KORE_MCP_ALLOWED_ORIGINS:-}"
      KORE_LEGACY_DB_OWNER_CONFIRMATION: "${KORE_LEGACY_DB_OWNER_CONFIRMATION:-}"
      FASTMCP_LOG_LEVEL: "${FASTMCP_LOG_LEVEL:-ERROR}"
      # No update check against PyPI at start (mcp_server.py forces this as well).
      FASTMCP_CHECK_FOR_UPDATES: "off"
      KORE_DB_PATH: /data/kore.db
      KORE_MCP_HOST: 0.0.0.0
      # The container side stays 8000; the host port is KORE_MCP_PORT in .env (see ports).
      KORE_MCP_PORT: "8000"
      # Same rule as for ingest; this port is always published on loopback (see ports).
      KORE_PUBLISHED_BIND: 127.0.0.1
    ports:
      - "127.0.0.1:${KORE_MCP_PORT:-8000}:8000"
    volumes:
      - kore-db:/data
    restart: unless-stopped
    # No process in the container needs root or capabilities (port > 1024, user kore).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    mem_limit: 384m
    pids_limit: 128

volumes:
  kore-db:
