name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nur Lesen: die Tests brauchen kein Schreibrecht am Repo.
permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r server/requirements.txt pytest
      - run: pytest server/tests server/integration_tests -q

  coach-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # bridge.py braucht nur die Standardbibliothek.
      - run: pip install pytest
      - run: pytest coach-bridge -q

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # kore-doctor braucht nur die Standardbibliothek.
      - run: pip install pytest
      - run: pytest scripts -q
