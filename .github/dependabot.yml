# Monatlich gebündelte Update-PRs für die gepinnten Abhängigkeiten, die CI-Actions und das Basis-Image:
# kleine Updates (minor/patch) je Ökosystem als EIN Pull Request, große Sprünge (major) weiter einzeln.
# Sicherheits-Updates kommen unabhängig davon sofort (Dependabot alerts / security updates in den
# Repo-Einstellungen). Die Eingaben server/requirements.txt und requirements-dev.txt hebt Dependabot an;
# die Lockfiles (mit Hashes) erzeugt man danach neu, siehe CONTRIBUTING.md. Ein Test schlägt an, wenn
# Eingabe und Lockfile auseinanderlaufen. Die gitleaks-Version in ci.yml und .pre-commit-config.yaml
# pflegt man von Hand.
version: 2
updates:
  - package-ecosystem: pip
    directory: /server
    schedule:
      interval: monthly
    groups:
      python-kleine-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions-kleine-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    # Einen Python-Wechsel (z. B. 3.12 → 3.14) machen wir bewusst und getestet, nicht als Routine-PR;
    # Sicherheits-Updates und neue Digests derselben Python-Version kommen weiter.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
