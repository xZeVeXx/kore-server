# Wöchentliche Update-PRs für die gepinnten Abhängigkeiten, die CI-Actions und das Basis-Image.
# Sicherheitswarnungen (Dependabot alerts) schaltet man zusätzlich in den Repo-Einstellungen ein.
version: 2
updates:
  - package-ecosystem: pip
    directory: /server
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
